<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>Go Web</title>
    <!-- 网站图标 -->
    <link rel="icon" href="/assets/images/common/starfruit_stage_6.png" type="image/png" />
    <!-- highlight.js 核心CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/default.min.css">
    <!-- 使用 MathJax 渲染 LaTeX 数学公式 -->
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" id="MathJax-script" async></script>

<body>
    <!-- 主容器 -->
    <div id="home">
        <!-- 左侧侧边栏 -->
        <div class="left-sidebar-wrapper">
            <!-- 作者信息 -->
            <div class="left-sidebar left-author-card">
                <img src="/assets/images/common/avatar.png" alt="糟糕，头像没显示出来..." class="author-avatar">
                <div class="author-nickname">Starfruit</div>
                <div class="author-realname">HJL</div>

                <div class="author-quote">
                    Have a good day!
                </div>
            </div>
            
            <!-- 日历 -->
            <div class="left-sidebar left-calendar-card">
                <div class="blog-calendar">
                    <div class="calendar-header">
                        <button class="calendar-btn" id="prevMonth">&lt;</button>
                        <div class="calendar-year-month" id="yearMonth">2025年12月</div>
                        <button class="calendar-btn" id="nextMonth">&gt;</button>
                    </div>
                    <div class="calendar-week">
                        <div class="week-item">日</div>
                        <div class="week-item">一</div>
                        <div class="week-item">二</div>
                        <div class="week-item">三</div>
                        <div class="week-item">四</div>
                        <div class="week-item">五</div>
                        <div class="week-item">六</div>
                    </div>
                    <div class="calendar-dates" id="calendarDates"></div>
                </div>
            </div>
            
            <!-- 相关文章 -->
            <div class="left-sidebar left-related-articles">
                <div class="sidebar-title">相关文章</div>
                <ul class="related-articles-list">
                    <li class="related-article-item">
                        <a href="/posts/data-structure/02_linear-list.html" class="related-article-link">（二）线性表</a>
                    </li>
                </ul>
            </div>
        </div>
        
        <!-- 中间正文 -->
        <div class="main-content-wrapper">
            <div class="article-content">
                <h1>Go Web</h1>
                
                <h2></h2>
                
            </div>
        </div>
        
        <!-- 右侧目录（自动包含代码块相关标题） -->
        <div class="right-catalog-wrapper">
            <div class="right-catalog">
                <div class="catalog-title">文章目录</div>
                <ul class="catalog-list" id="dynamicCatalogList"></ul>
            </div>
        </div>
    </div>
    
    <!-- 回到顶部按钮 -->
    <button id="backToTopBtn" class="back-to-top-btn" title="回到顶部">↑</button>
    
    <!-- highlight.js 核心JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- highlight.js 行号插件 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlightjs-line-numbers.js/2.8.0/highlightjs-line-numbers.min.js"></script>
    <!-- 添加C++语言支持 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/cpp.min.js"></script>
    <!-- 添加Go语言支持 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/go.min.js"></script>
    <!-- 自定义js -->
    <script src="/assets/js/main.js"></script>
